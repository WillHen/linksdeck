name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  install_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Set up Supabase
        uses: supabase/setup-cli@v2.1.1

      - name: Start Supabase
        run: |
          touch .env.test
          supabase start
          # Generate .env.test from the CLI's machine-readable env output and map
          # each value to the name the app expects. This avoids parsing the
          # human-readable `supabase status` table, whose labels/layout change
          # between CLI versions (the v2 format broke the old grep/awk parsing).
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            > .env.test
          # Placeholder RESEND_API_KEY so `next build` can construct the Resend
          # client at module load (no emails are sent during the build).
          echo 'RESEND_API_KEY="re_test_placeholder"' >> .env.test

      - name: Apply migrations
        run: supabase db reset --local

      - name: Seed data
        run: node supabase/seedUser.js

      - name: Build app
        run: npm run test-build

      - name: Start test server
        run: npm run test-start &

      - name: Run e2e Playwright tests
        run: |
          npx playwright install --with-deps
          # Wait for the production server to accept connections before testing,
          # so the first navigation doesn't race startup.
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:3000; do sleep 1; done'
          npx playwright test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30

      - name: Stop test server
        if: always()
        run: |
          kill $(jobs -p) || true
